[project]
name = "pureml"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.5.0",
    "textual>=8.2.8",
    "torch>=2.13.0",
]
[tool.uv.sources]
torch = [
    { index = "pytorch-cu129", marker = "sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cu129"
url = "https://download.pytorch.org/whl/cu129"
explicit = true

[project.scripts]
pureml-tui = "pureml.tui.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pureml"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
