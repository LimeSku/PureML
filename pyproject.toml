[project]
name = "pureml"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.5.0",
    "textual>=8.2.8",
]

[project.scripts]
pureml-tui = "pureml.tui.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pureml"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
